<html>
<html lang="en">

<head>
    <title>Let's Explore You by Your Name</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="bot-avatar">
                <h1>NameWise</h1>
                <p>Your name has a story. Let's see if it matches you.</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </header>

        <!-- Chat Area -->
        <section class="chat-area" id="chatArea">
            <!-- Welcome message -->
            <div class="message-bot">
                <p>
                    Hi! 👋 I'm NameWise.
                </p>
                <p>
                    I'll use a small name database to discover
                    something interesting about you.
                </p>
            </div>

            <!-- Ask for name -->
            <div class="name-information">
                <p>
                    Let's start — <strong>What's your name?</strong>
                </p>
            </div>

            <!-- Name input -->
            <div class="message user-message" id="nameInputSection">

                <div class="message-content">
                    <input
                        type="text"
                        id="userInputName"
                        placeholder="Type your name..."
                        autocomplete="off"
                    >
                    <button
                        id="sendNameButton"
                        aria-label="Send name">
                        ➤
                    </button>
                </div>
            </div>

            <!-- Name response -->
            <div
                class="message bot-message hidden"
                id="nameResponse">

                <div class="message-content">
                    <p id="nameGreeting">
                        <!-- JavaScript will insert greeting -->
                    </p>
                    <p id="nameMeaning">
                        <!-- JavaScript will insert name meaning -->
                    </p>
                </div>
            </div>

            <!-- Fun fact -->
            <div
                class="message bot-message hidden"
                id="funFactSection">

                <div class="message-content">
                    <div class="fact-card">
                        <span class="fact-label">
                            FUN FACT
                        </span>
                        <p id="funFact">
                            <!-- JavaScript will insert fun fact -->
                        </p>
                    </div>
                
                    <p>
                        Does this fun fact match you?
                    </p>

                    <div class="choice-buttons">
                        <button
                            class="choice-btn yes-btn"
                            id="yesButton">
                            👍 Yes, that's me
                        </button>
                        <button
                            class="choice-btn no-btn"
                            id="noButton">
                            👎 Not really
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Bottom input -->
        <footer class="chat-input-area hidden" id="chatInputArea">

            <input
                type="text"
                id="userInput"
                placeholder="Type your answer..."
                autocomplete="off"
            >
            <button
                id="sendButton"
                aria-label="Send message">
                ➤
            </button>
        </footer>
    </main>

    <script src="script.js"></script>

</body>

</html>
